name: Reset demo

# Resetea el space demo cada 6 horas. No usamos Vercel Cron para esto
# porque el plan Hobby limita a 1 cron diario por proyecto, y este tiene
# que ser cada 6h. GitHub Actions free no tiene esa limitacion.
#
# Llama al endpoint /api/cron/reset-demo de la app desplegada, que internamente
# ejecuta private.reset_demo_space() y private.cleanup_anonymous_users().
#
# Requisitos:
# - Secret CRON_SECRET en Settings → Secrets and variables → Actions.
#   Mismo valor que el CRON_SECRET configurado en Vercel.
# - Variable APP_URL en Settings → Secrets and variables → Actions →
#   Variables. Ejemplo: https://vantage.vercel.app (sin slash final).
#   Es Variable, no Secret, porque no es sensible y asi se ve en los logs.
#
# Trigger manual disponible (workflow_dispatch) para probar.

on:
  schedule:
    # Cada 6 horas (UTC): 00:00, 06:00, 12:00, 18:00
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

jobs:
  reset:
    name: Llamar a /api/cron/reset-demo
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hit endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Variable APP_URL no configurada"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Secret CRON_SECRET no configurado"
            exit 1
          fi
          # -f hace fallar si HTTP != 2xx. --max-time 60s suficiente para el reset.
          curl -fsSL --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/reset-demo"

  # ─── Keepalive contra la desactivacion por inactividad ─────────────────
  # GitHub desactiva los workflows con `schedule` cuando el repo lleva 60
  # dias sin commits. Este job empuja un commit vacio si nos acercamos al
  # limite, reseteando el contador. El push va firmado por GITHUB_TOKEN, y
  # los pushes hechos con ese token no disparan workflows, asi que no gasta
  # minutos de CI ni provoca un deploy.
  keepalive:
    name: Commit vacio si el repo lleva 50 dias parado
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'schedule'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Push empty commit si procede
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Dias desde el ultimo commit: $days"
          if [ "$days" -lt 50 ]; then
            echo "Por debajo del umbral, no hace falta keepalive."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore(ci): keepalive para mantener activos los workflows programados"
          git push

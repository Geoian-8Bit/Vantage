name: DB Backup

# Backup semanal de la DB Supabase con pg_dump, cifrado con GPG (AES256)
# antes de subirse como artifact. El repo es publico → el artifact tambien
# lo es para quien tenga acceso de lectura al repo, por eso ciframos.
#
# Retencion del artifact: 90 dias.
#
# Requisitos (secrets):
# - DATABASE_URL: connection string Modo Session (puerto 5432) de Supabase.
# - BACKUP_PASSPHRASE: passphrase para cifrar/descifrar el dump.
#
# Trigger manual disponible (workflow_dispatch) para probar.
#
# COMO RESTAURAR UN BACKUP:
# 1. Descarga el .zip del artifact desde Actions → run → Artifacts.
# 2. Extrae el .sql.gz.gpg.
# 3. Descifrar (necesitas la BACKUP_PASSPHRASE de .env.local):
#      gpg --batch --passphrase "$BACKUP_PASSPHRASE" \
#          --output backup.sql.gz vantage_backup_YYYY-MM-DD.sql.gz.gpg
#      gunzip backup.sql.gz
# 4. Restaurar contra un proyecto Supabase (cuidado: borra el schema public):
#      psql "$DATABASE_URL" < backup.sql

on:
  schedule:
    # Domingos a las 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  backup:
    name: pg_dump + cifrar con GPG
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install PostgreSQL 17 client
        # Supabase corre Postgres 17. El cliente por defecto de Ubuntu es
        # mas antiguo. Anadimos el repo apt oficial de PostgreSQL.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Backup and encrypt database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret no esta configurado"
            exit 1
          fi
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::BACKUP_PASSPHRASE secret no esta configurado"
            exit 1
          fi

          STAMP=$(date -u +%Y-%m-%d)
          SQL_FILE="vantage_backup_${STAMP}.sql"
          GZ_FILE="${SQL_FILE}.gz"
          ENC_FILE="${GZ_FILE}.gpg"

          # Dump del schema public, sin owners ni privileges (portable).
          pg_dump \
            --schema=public \
            --clean --if-exists \
            --quote-all-identifiers \
            --no-owner --no-privileges \
            "$DATABASE_URL" > "$SQL_FILE"

          gzip "$SQL_FILE"

          # Cifrar simetricamente con AES256. --batch + --yes para no
          # preguntar nada. La passphrase nunca toca disco.
          gpg --batch --yes --symmetric --cipher-algo AES256 \
              --passphrase "$BACKUP_PASSPHRASE" \
              --output "$ENC_FILE" \
              "$GZ_FILE"

          # Borrar el dump sin cifrar antes del upload — el artifact solo
          # contiene el .gpg.
          rm -f "$GZ_FILE"

          ls -lh "$ENC_FILE"

      - name: Upload encrypted backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: vantage-backup-${{ github.run_id }}
          path: vantage_backup_*.sql.gz.gpg
          retention-days: 90
          if-no-files-found: error
